name: Backfill Market Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Massive backfill
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python scripts/backfill_market_data.py

      - name: Show backfill status
        run: |
          echo "=== data directory ==="
          ls -lah data

          echo ""
          echo "=== backfill progress ==="

          if [ -f data/backfill_progress.json ]; then
            cat data/backfill_progress.json
          else
            echo "Keine Progress-Datei vorhanden."
          fi

          echo ""
          echo "=== universe summary ==="

          if [ -f data/universe.json ]; then
            python - <<'PY'
          import json

          with open("data/universe.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data.get("counts", {}))
          PY
          else
            echo "Keine Universe-Datei vorhanden."
          fi

          echo ""
          echo "=== history file size ==="

          if [ -f data/history.json ]; then
            ls -lh data/history.json
          else
            echo "Keine history.json vorhanden."
          fi

      - name: Commit and push backfill data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          git add data/backfill_progress.json
          git add data/universe.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Backfill market data"

          echo ""
          echo "Aktuellen Stand von origin/main holen..."
          git fetch origin main

          echo ""
          echo "Backfill-Commit auf aktuellen main-Stand setzen..."
          git rebase origin/main

          echo ""
          echo "Änderungen pushen..."
          git push origin HEAD:main

      - name: Final status
        run: |
          echo ""
          echo "===================================="
          echo "BACKFILL WORKFLOW ERFOLGREICH"
          echo "===================================="

          if [ -f data/backfill_progress.json ]; then
            echo ""
            echo "Aktueller Fortschritt:"
            cat data/backfill_progress.json
          fi

          if [ -f data/history.json ]; then
            echo ""
            echo "History-Dateigröße:"
            ls -lh data/history.json
          fi
