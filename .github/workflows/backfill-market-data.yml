name: Backfill Market Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-backfill
  cancel-in-progress: false

jobs:

  backfill:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Massive backfill
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python scripts/backfill_market_data.py

      - name: Show backfill status
        run: |
          echo "=== data directory ==="
          ls -lah data

          echo ""
          echo "=== backfill progress ==="

          if [ -f data/backfill_progress.json ]; then
            cat data/backfill_progress.json
          else
            echo "Keine Progress-Datei vorhanden."
          fi

      - name: Commit backfill data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json
          git add data/backfill_progress.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Backfill market data"
            git push
          fi
