name: Update Market Data

on:
  workflow_dispatch:

  schedule:
    # Montag bis Freitag nach US-Börsenschluss
    - cron: "15 23 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strategy-c-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Massive market data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/update_market_data.py

      - name: Create test homepage
        run: |
          cat > data/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <title>Strategy Market Data</title>
          </head>
          <body>
            <h1>Strategy Market Data</h1>
            <p>GitHub Pages funktioniert.</p>
            <ul>
              <li><a href="latest.json">latest.json</a></li>
              <li><a href="history.json">history.json</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Show generated files
        run: |
          echo "Inhalt von data:"
          ls -lah data

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi

          git commit -m "Update market data"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: data

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
