name: Update Market Data

on:
  workflow_dispatch:

  schedule:
    # 23:15 UTC Montag-Freitag
    # Damit sind die regulären US-Märkte sicher geschlossen.
    - cron: "15 23 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:

  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update Massive market data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          python scripts/update_market_data.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history.json data/latest.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update market data"
            git push
          fi


  deploy:
    needs: update

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      - name: Checkout updated repository
        uses: actions/checkout@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "data"

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
