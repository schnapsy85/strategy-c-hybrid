name: Daily Strategy A/B/C Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC and has no Europe/Berlin timezone support.
    # Two runs + a local-time guard make this DST-safe. Exactly one run lands in 22:xx Berlin.
    - cron: '15 20 * * 1-5'
    - cron: '15 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: strategy-c-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Update shared A/C market data and scan Strategy C
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/daily_scan.py

      - name: Scan Strategy A
        run: python scripts/strategy_a_scan.py

      - name: Scan Strategy B
        run: python scripts/strategy_b_scan.py

      - name: Sync scan outputs to data
        run: |
          cp docs/latest.json data/latest.json
          cp docs/strategy_a_latest.json data/strategy_a_latest.json
          cp docs/strategy_b_latest.json data/strategy_b_latest.json

      - name: Commit cache and A/B/C results
        run: |
          git config user.name "strategy-c-bot"
          git config user.email "strategy-c-bot@users.noreply.github.com"

          git add data/ohlcv.csv.gz data/latest.json data/strategy_a_latest.json data/strategy_b_latest.json \
                  docs/latest.json docs/strategy_a_latest.json docs/strategy_b_latest.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "Daily Strategy A/B/C scan"
          git push origin HEAD:main
